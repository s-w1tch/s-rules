[custom]
;不要随意改变关键字，否则会导致出错
;基于 ACL4SSR 规则集的 SubConverter 模板；规则按从上到下的顺序匹配

;广告拦截：BanAD 与 BanProgramAD 共用广告拦截组
;自动测速/故障转移/负载均衡：均未启用；节点组由用户选择
;微软服务：Bing、OneDrive、Microsoft 共用一个策略组
;Apple 服务：更新、推送使用自定义规则，其余使用 ACL4SSR 规则
;中国 IP 直连：ChinaCompanyIp 与 GEOIP,CN；不加载 ChinaIp
;国外代理：YouTube、Netflix、国外媒体、Telegram、ProxyGFWlist 共用节点选择组
;国内媒体：网易音乐、哔哩哔哩、ChinaMedia 共用全球直连组

;自定义规则优先于下方通用规则；同一目标组须在策略组区定义
;Apple 系统更新，可在策略组中选择拦截或放行
ruleset=🍎 s_apple_ota,https://raw.githubusercontent.com/s-w1tch/s-rules/refs/heads/main/rules/s_apple_ota.list
;Apple 推送域名和 IP 段
ruleset=📲 s_apple_push,https://raw.githubusercontent.com/s-w1tch/s-rules/refs/heads/main/rules/s_apple_push.list
;自定义强制直连名单
ruleset=🎯 s_direct,https://raw.githubusercontent.com/s-w1tch/s-rules/refs/heads/main/rules/s_direct.list
;自定义强制拦截名单
ruleset=🛑 s_reject,https://raw.githubusercontent.com/s-w1tch/s-rules/refs/heads/main/rules/s_reject.list
;自定义美国与欧洲规则；策略组默认选地区节点，也允许手动切换
ruleset=🇺🇲 s_us,https://raw.githubusercontent.com/s-w1tch/s-rules/refs/heads/main/rules/s_us.list
ruleset=🇪🇺 s_eu,https://raw.githubusercontent.com/s-w1tch/s-rules/refs/heads/main/rules/s_eu.list
;本地网络和 ACL4SSR 放行名单
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
;普通广告和应用广告共用广告拦截策略组
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
;Google FCM 推送；中国可直连的 Google 与 Steam 服务
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
;Bing、OneDrive、Microsoft 共用微软服务组
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Bing.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
;Apple 服务（位于自定义更新/推送规则之后）
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
;通用 AI、OpenAI 与自定义 AI 域名共用 AI 平台组
; ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
; ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/s-w1tch/s-rules/refs/heads/main/rules/s_ai.list
;游戏平台分别来自 Epic、Origin、Sony、Steam、Nintendo
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Epic.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Origin.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Sony.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Nintendo.list
;YouTube、Netflix、国外媒体与 Telegram 消息统一交给节点选择
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
;网易音乐、哔哩哔哩（含港澳台名单）及国内媒体统一交给全球直连（默认 DIRECT）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/NetEaseMusic.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/BilibiliHMT.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bilibili.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
;国外常见代理域名
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
;国内域名、厂商 IP 与下载域名
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
;剩余中国及私有 IP 直连，最后由 FINAL 处理未命中流量
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🎯 全球直连,[]GEOIP,PRIVATE
ruleset=🐟 漏网之鱼,[]FINAL

;策略组：[] 表示引用现有策略组/内置出站；正则表达式筛选订阅节点
;总入口与全节点手动选择
custom_proxy_group=🚀 节点选择`select`[]🚀 手动切换`[]🇺🇲 美国节点`[]🇪🇺 欧洲节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]DIRECT
custom_proxy_group=🚀 手动切换`select`.*
;自定义 Apple 更新、推送、直连、拦截与地区出口
custom_proxy_group=🍎 s_apple_ota`select`[]REJECT`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇪🇺 欧洲节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=📲 s_apple_push`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇪🇺 欧洲节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=🎯 s_direct`select`[]DIRECT
custom_proxy_group=🛑 s_reject`select`[]REJECT
custom_proxy_group=🇺🇲 s_us`select`[]🇺🇲 美国节点`[]🚀 手动切换
custom_proxy_group=🇪🇺 s_eu`select`[]🇪🇺 欧洲节点`[]🚀 手动切换
;AI 平台按以下节点名称关键词筛选，不引用其他分组；实际出口以匹配到的节点为准
custom_proxy_group=💬 Ai平台`select`(c77s1|c77s2|c77s3|c77s801|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|夏威夷|US|United States)
;应用服务分流：FCM、微软、Apple 和游戏
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇪🇺 欧洲节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇪🇺 欧洲节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇪🇺 欧洲节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=🎮 游戏平台`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇪🇺 欧洲节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
;通用直连、广告拦截及兜底：首个候选项为默认值
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇪🇺 欧洲节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
;地区节点组按名称关键词筛选，均由用户手动选择（正则不保证节点真实所在地）
custom_proxy_group=🇺🇲 美国节点`select`(c77s1|c77s2|c77s3|c77s801|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|夏威夷|US|United States)
custom_proxy_group=🇪🇺 欧洲节点`select`(c77s5|欧洲|欧盟|欧|EU|Europe|德国|德意志|法国|荷兰|英国|爱尔兰|意大利|西班牙|葡萄牙|瑞士|奥地利|比利时|卢森堡|波兰|捷克|匈牙利|罗马尼亚|保加利亚|希腊|丹麦|瑞典|挪威|芬兰|冰岛|爱沙尼亚|拉脱维亚|立陶宛|斯洛伐克|斯洛文尼亚|克罗地亚|塞尔维亚|乌克兰|DE|Germany|FR|France|NL|Netherlands|UK|GB|United Kingdom|Ireland|Italy|Spain|Portugal|Switzerland|Austria|Belgium|Luxembourg|Poland|Czech|Hungary|Romania|Bulgaria|Greece|Denmark|Sweden|Norway|Finland|Iceland|Estonia|Latvia|Lithuania|Slovakia|Slovenia|Croatia|Serbia|Ukraine)
custom_proxy_group=🇭🇰 香港节点`select`(港|HK|hk|Hong Kong|HongKong|hongkong)
custom_proxy_group=🇨🇳 台湾节点`select`(台|新北|彰化|TW|Taiwan)
custom_proxy_group=🇸🇬 狮城节点`select`(新加坡|坡|狮城|SG|Singapore)
custom_proxy_group=🇯🇵 日本节点`select`(c77s4|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)
custom_proxy_group=🇰🇷 韩国节点`select`(KR|Korea|KOR|首尔|韩|韓)

;生成规则并覆盖基础模板原有规则
enable_rule_generator=true
overwrite_original_rules=true

;Clash 基础模板：保留默认端口/运行参数，注入 DNS 配置；客户端仍须自行劫持 DNS
clash_rule_base=https://raw.githubusercontent.com/s-w1tch/s-rules/refs/heads/main/rules/s_clash_rule_base.yaml
